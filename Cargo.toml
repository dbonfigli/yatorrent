[package]
name = "yatorrent"
version = "0.1.0"
edition = "2024"
description = "Yet Another Torrent Client"

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
sha1 = "0.11.0"
reqwest = "0.13.4"
tokio = { version = "1.53.1", features = ["full"] }
assert_matches = "1.5"
rand = "0.10.2"
log = "0.4"
env_logger = "0.11.11"
size = "0.5.0"
trait-variant = "0.1.3"
clap = { version = "4.6.6", features = ["derive", "env"] }
num-bigint = "0.5.1"
derivative = "2.2.0"
anyhow = "1.0.104"
rlimit = "0.11.0"
url = "2.5.8"
percent-encoding = "2.3.2"
hex = "0.4.3"
thiserror = "2.0.20"
colored = "3.1.1"
base32 = "0.5.1"
